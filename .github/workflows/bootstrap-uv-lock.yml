name: Bootstrap uv lock
# Temporary: removed after uv.lock is committed.

on:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/bootstrap-uv-lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          version: latest-known
      - name: Generate lockfile
        run: uv lock
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

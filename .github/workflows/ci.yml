name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django_api
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: settings.test
      POSTGRES_DB: django_api
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Production deploy checks
        env:
          DJANGO_SETTINGS_MODULE: settings.production
          SECRET_KEY: ci-only-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ-abcdefghijklmnopqrstuvwxyz
          WEBHOOK_SIGNING_MASTER_KEY: ci-webhook-${{ github.sha }}
          ALLOWED_HOSTS: example.com
        run: uv run python manage.py check --deploy
      - name: Dependency audit
        run: uv run pip-audit --strict
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Architecture
        run: uv run python scripts/check_architecture.py
      - name: API schema validation
        run: uv run python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
      - name: Compatibility gates
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPATIBILITY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'compatibility-approved') }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/compat-base "$BASE_SHA"
          (
            cd /tmp/compat-base
            uv run --locked --group dev python manage.py spectacular \
              --file /tmp/base-schema.yaml --validate --fail-on-warn
          )
          args=()
          if [ "$COMPATIBILITY_APPROVED" = "true" ]; then
            args+=(--allow-breaking)
          fi
          uv run python scripts/check_openapi_compatibility.py \
            /tmp/base-schema.yaml /tmp/schema.yaml "${args[@]}"
          uv run python scripts/check_migration_safety.py \
            --base "$BASE_SHA" "${args[@]}"
      - name: Tests
        run: uv run pytest
      - name: Compose config
        run: |
          cp env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose --profile async -f compose.yaml config --quiet
          APP_IMAGE=example.invalid/starter@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            APP_ENV_FILE="$PWD/deploy/production.env.example" \
            docker compose -f compose.production.yaml --profile async config --quiet
      - name: Shell syntax
        run: |
          bash -n scripts/smoke_production.sh
          sh -n scripts/deploy.sh

  resilience:
    name: Resilience contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django_api
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: settings.test
      POSTGRES_DB: django_api
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - name: Failure and recovery contracts
        run: |
          uv run pytest \
            tests/test_resilience.py \
            tests/test_deployment.py::test_readiness_failure_is_generic_and_uncached \
            tests/test_private_files.py::test_ambiguous_storage_failure_has_durable_compensation \
            tests/test_private_files.py::test_deletion_retry_replay_and_error_hygiene


  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and exercise all runtime variants with disposable PostgreSQL
        run: bash scripts/smoke_production.sh

  cache-redis:
    name: Optional Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django_api
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: settings.test
      POSTGRES_DB: django_api
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
      - name: Sync optional dependencies
        run: uv sync --locked --extra async --group dev
      - name: Real Redis cache integration
        run: uv run --extra async pytest tests/test_caching.py tests/test_cache_redis.py

  storage-s3:
    name: Private storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django_api
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: settings.test
      POSTGRES_DB: django_api
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: ci-private-storage
      AWS_SECRET_ACCESS_KEY: ci-private-storage-secret
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
      - name: Sync storage dependencies
        run: uv sync --locked --extra storage --group dev
      - name: Audit storage dependencies
        run: uv run --extra storage pip-audit --strict
      - name: Set up Go for disposable S3 fixture
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build and start isolated S3-compatible server
        run: |
          # Pinned test fixture only, not a production-provider recommendation.
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - name: Real filesystem and S3 integration
        run: uv run --extra storage pytest tests/test_private_files.py tests/test_private_storage_config.py tests/test_private_files_s3.py
      - name: Stop S3 fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then kill "$(cat "$RUNNER_TEMP/minio.pid")" || true; fi

name: Telemetry lock resolver

on:
  push:
    branches: [feat/opentelemetry-metrics-foundation]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: false
      - name: Resolve lockfile
        run: uv lock
      - name: Verify telemetry environment
        run: uv sync --locked --extra telemetry --group dev
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: resolve telemetry dependency lock"
          git push origin HEAD:feat/opentelemetry-metrics-foundation

name: webhooks
type: integration
owns:
  - tenant webhook subscriptions
  - signing-key versioning
  - outbound delivery queue and history
  - retry and replay policy
public_api:
  - GET /api/v1/organizations/{organization_id}/webhooks/
  - POST /api/v1/organizations/{organization_id}/webhooks/
  - GET /api/v1/organizations/{organization_id}/webhooks/{id}/
  - PATCH /api/v1/organizations/{organization_id}/webhooks/{id}/
  - DELETE /api/v1/organizations/{organization_id}/webhooks/{id}/
  - POST /api/v1/organizations/{organization_id}/webhooks/{id}/rotate-secret/
  - GET /api/v1/organizations/{organization_id}/webhook-deliveries/
  - POST /api/v1/organizations/{organization_id}/webhook-deliveries/{id}/replay/
depends_on:
  - organizations
uses:
  - core.outbox
  - core.audit
  - HTTPS/TLS
emits: []
consumes:
  - organizations.organization-created
  - organizations.organization-updated
  - organizations.membership-added
  - organizations.membership-updated
  - organizations.membership-removed
  - tickets.ticket-created
  - tickets.ticket-updated
  - tickets.attachment-added
rules:
  - only organization owner/admin may manage subscriptions and delivery history
  - signing material is derived and never persisted in plaintext or returned by API
  - outbound delivery never runs inside the request/business transaction
  - endpoints require HTTPS and pass DNS/IP SSRF checks on every attempt
  - personal/non-tenant events are not delivered
  - response bodies are never persisted

[project]
name = "django-api-starter"
version = "1.0.0"
description = "A Django-first, modular API starter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=6.1.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "django-cors-headers>=4.3,<5.0",
    "django-filter>=24.0,<26.0",
    "psycopg2-binary>=2.9,<3.0",
    "dj-database-url>=2.0,<3.0",
    "drf-spectacular>=0.27,<1.0",
    "python-decouple>=3.8,<4.0",
    "whitenoise>=6.6,<7.0",
    "gunicorn>=21.2,<24.0",
    "sentry-sdk>=2.0,<3.0",
]

[project.optional-dependencies]
async = [
    "celery>=5.3,<6.0",
    "redis>=5.0,<7.0",
]
storage = [
    "django-storages>=1.14,<2.0",
    "boto3>=1.34,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-django>=4.14,<5.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-xdist>=3.6,<4.0",
    "factory-boy>=3.3,<4.0",
    "faker>=20.0,<40.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3.0",
    "PyYAML>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
    "django-debug-toolbar>=4.2,<7.0",
    "django-extensions>=3.2,<4.0",
    "ipython>=8.17,<10.0",
]

[tool.uv]
package = false
required-version = ">=0.12.17,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/*" = ["E501"]
"settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "apps"]
addopts = "-q --strict-config --strict-markers"
filterwarnings = [
    "error::rest_framework.deprecation.RemovedInNextDRFVersionWarning",
    "always::rest_framework.deprecation.RemovedAfterNextDRFVersionWarning",
    "error::django.utils.deprecation.RemovedInDjango70Warning",
]

[[tool.mypy.overrides]]
module = ["decouple", "decouple.*"]
disable_error_code = ["import-untyped"]
